<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if title %}{{ title }} — {% endif %}ignorantforager</title>
  {% if description %}<meta name="description" content="{{ description }}" />{% endif %}
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <a class="site-title" href="{{ url_for('index') }}">ignorantforager</a>
      <nav class="site-nav">
        <a href="{{ url_for('index') }}">Home</a>
        {% for p in nav_pages %}
        <a href="{{ url_for('page', slug=p.slug) }}">{{ p.nav_label }}</a>
        {% endfor %}
      </nav>
    </header>

    <main class="site-main">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <span>ignorantforager.com</span>
      <a href="https://github.com/cadencejames" target="_blank" rel="noopener">GitHub</a>
      <a href="https://library.ignorantforager.com" target="_blank" rel="noopener">Library</a>
    </footer>
  </div>
</body>
</html>
